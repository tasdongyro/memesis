[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "memesis"
version = "0.1.0"
description = "A programming language for AI agents, written in memes. sus marks what you cannot trust, yolo marks what you cannot undo."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
dependencies = []
keywords = ["agents", "dsl", "language", "llm", "memes", "prompt-injection", "safety"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Topic :: Software Development :: Interpreters",
]

[project.optional-dependencies]
anthropic = ["anthropic>=1.0"]
dev = ["pytest>=8"]

[project.scripts]
memesis = "memesis.cli:main"

[project.urls]
Homepage = "https://github.com/tasdongyro/memesis"

[tool.setuptools]
packages = ["memesis"]

[tool.pytest.ini_options]
testpaths = ["tests"]
